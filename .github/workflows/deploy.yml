name: Despliegue EdwinRamiro AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Copiar archivos a la EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "index.html,Dockerfile"
          target: "/home/ubuntu/app_edwinramiro"

      - name: Instalar Docker y Desplegar
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Instalar Docker si no existe
            if ! command -v docker &> /dev/null; then
              sudo apt-get update -y
              sudo apt-get install docker.io -y
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # 2. Ir a la carpeta del proyecto
            cd /home/ubuntu/app_edwinramiro

            # 3. Construir la imagen Docker
            sudo docker build -t edwinramiro-web .

            # 4. Detener y limpiar el contenedor anterior si existe
            sudo docker stop app-edwinramiro || true
            sudo docker rm app-edwinramiro || true

            # 5. Ejecutar el nuevo contenedor en el puerto 80
            sudo docker run -d -p 80:80 --name app-edwinramiro edwinramiro-web
